services:
  monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      CONFIG_PATH: /app/config/strategy.yaml
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set a 16+ character DASHBOARD_PASSWORD in .env before Docker startup}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - monitor-data:/app/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  monitor-data:
