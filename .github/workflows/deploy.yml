name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ant-monitor-production
  cancel-in-progress: false

env:
  GCP_PROJECT: orderhistory-test
  GCP_ZONE: asia-east2-a
  GCP_INSTANCE: ant-monitor
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/421032215990/locations/global/workloadIdentityPools/github-ant-monitor/providers/github-ant-perp-dashboard
  GCP_SERVICE_ACCOUNT: github-ant-monitor-deployer@orderhistory-test.iam.gserviceaccount.com

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate Docker Compose file
        run: docker compose config --no-interpolate --quiet

  deploy:
    name: Deploy to Google Cloud
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy through IAP
        run: ./deploy/ci-gce-deploy.sh
